name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm libasound2-dev libva-dev libfontconfig1-dev             libgbm-dev libxcb1-dev libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev             libgtk-4-dev libpipewire-0.3-dev libudev-dev libegl-dev libwayland-dev             libxkbcommon-dev mesa-vulkan-drivers libvulkan1 xvfb
      # `shaderloom` compiles WGSL to DXIL on Windows through `dxc`
      - name: Install DirectX Shader Compiler
        if: runner.os == 'Windows'
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - uses: Swatinem/rust-cache@v2
      # `--all-features` is not a valid selection for this workspace:
      # `waterui-browser-cef` rejects `cef-runtime` and `compile-only` together
      # in its build script, because one links a CEF binary distribution and the
      # other stands in for it with documentation stubs. Every feature of both
      # crates is therefore named by the pass that covers it.
      - name: Test the default features
        run: cargo test --workspace --all-targets
      # Chromium sandboxes its child processes with a user namespace when it can
      # and falls back to the setuid helper when it cannot. Ubuntu 24.04 refuses
      # unprivileged user namespaces by default, which forces the fallback onto
      # a helper no CI job can make setuid root, and Chromium aborts rather than
      # run unsandboxed. Lifting the restriction keeps the sandbox on, which is
      # what `no_sandbox: 0` asks of every platform.
      - name: Allow Chromium's namespace sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Chromium needs a display server to start, and a hosted Linux runner has
      # none. `xvfb-run` supplies one for the process it launches, which is the
      # whole cargo invocation so the staged runtime's child processes inherit
      # it.
      #
      # A hosted runner has no GPU either, and the real-engine checks need one:
      # a CEF browser here is windowless and exports its frames as a shared
      # texture, which on Linux is a DMA-BUF out of Chromium's GPU process, and
      # llvmpipe has no GPU allocation to export. The checks probe for an
      # adapter before initializing CEF and skip with a reason on this runner
      # (water-rs/browsers#12), so what this step proves on Linux is that the
      # crate builds, its unit tests pass, and the runtime stages and re-runs
      # the checks from itself. Do not drop the step for that: the day the leg
      # moves to a machine with a GPU, the same command runs every check.
      - name: Test the CEF runtime surfaces
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -p waterui-browser-cef --all-targets --features chromium,real-engine
      - name: Test the CEF runtime surfaces
        if: runner.os != 'Linux'
        run: cargo test -p waterui-browser-cef --all-targets --features chromium,real-engine
      - name: Test the WPE surfaces
        run: cargo test -p waterui-browser-wpe --all-targets --features real-engine,runtime-smoke
      - name: Compile the CEF backend without its binary distribution
        run: cargo check -p waterui-browser-cef --all-targets --no-default-features --features compile-only,chromium,webview

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm libasound2-dev libva-dev libfontconfig1-dev             libgbm-dev libxcb1-dev libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev             libgtk-4-dev libpipewire-0.3-dev libudev-dev libegl-dev libwayland-dev             libxkbcommon-dev mesa-vulkan-drivers libvulkan1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # `--all-features` is not a valid selection for this workspace:
      # `waterui-browser-cef` rejects `cef-runtime` and `compile-only` together
      # in its build script, because one links a CEF binary distribution and the
      # other stands in for it with documentation stubs. Every feature of both
      # crates is therefore named by the pass that covers it.
      - name: Clippy the default features
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy the CEF runtime surfaces
        run: cargo clippy -p waterui-browser-cef --all-targets --features chromium,real-engine -- -D warnings
      - name: Clippy the WPE surfaces
        run: cargo clippy -p waterui-browser-wpe --all-targets --features real-engine,runtime-smoke -- -D warnings
      - name: Clippy the CEF backend without its binary distribution
        run: cargo clippy -p waterui-browser-cef --all-targets --no-default-features --features compile-only,chromium,webview -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm libasound2-dev libva-dev libfontconfig1-dev             libgbm-dev libxcb1-dev libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev             libgtk-4-dev libpipewire-0.3-dev libudev-dev libegl-dev libwayland-dev             libxkbcommon-dev mesa-vulkan-drivers libvulkan1
      - uses: Swatinem/rust-cache@v2
      # `--all-features` is not a valid selection for this workspace:
      # `waterui-browser-cef` rejects `cef-runtime` and `compile-only` together
      # in its build script, because one links a CEF binary distribution and the
      # other stands in for it with documentation stubs. Every feature of both
      # crates is therefore named by the pass that covers it.
      - name: Check the default features
        run: cargo check --workspace
      - name: Check the CEF runtime surfaces
        run: cargo check -p waterui-browser-cef --features chromium,real-engine
      - name: Check the WPE surfaces
        run: cargo check -p waterui-browser-wpe --features real-engine,runtime-smoke
      - name: Check the CEF backend without its binary distribution
        run: cargo check -p waterui-browser-cef --no-default-features --features compile-only,chromium,webview
