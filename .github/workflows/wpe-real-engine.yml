name: WPE Real Engine

# The web view bridge has failed three times in ways no Rust-side test could
# see — replies crossing as base64, a frozen `waterui` object, integers past
# 2^53 losing their low bits — so `browser-wpe/tests/real_engine.rs` drives a
# genuine WPE WebKit engine, and this workflow is where it runs.
#
# It is its own workflow rather than a leg of `ci.yml` because a hosted runner
# cannot obtain the runtime the cheap way. The `water` CLI downloads a prebuilt
# archive for the pinned release, and none is published: no
# `browser-runtime-manifest.json` and no `waterui-wpe-2.52.5-linux-*.zip` exists
# on any release of `water-rs/waterui` or of this repository. What is left is
# `runtime/build-runtime.sh`, which compiles WPE WebKit from the pinned source
# tarball — a multi-hour job, hence the timeout below and the caches. There are
# two of them because the job has two halves with wildly different costs. The
# packaged artifact is keyed on everything that decides what it contains, so it
# is rebuilt whenever the pinned version, the packaging or the C bridge change;
# WPE WebKit itself is keyed on the pin and the build options alone, so a change
# to the bridge — seconds of compiling — reuses the hours already spent.
#
# Dispatch is the only trigger. `push` and `pull_request` filters would put a
# multi-hour job on the critical path of every change to these paths, and until
# a build here has actually succeeded they would paint a red X that is quickly
# learned-to-ignore. Add the path filters and a weekly schedule — the schedule
# keeps the runtime cache from being evicted for inactivity, which would put the
# next run back on the multi-hour path — in the same change that makes the build
# succeed.
#
# The packaged runtime itself is not left to `actions/cache`. The repository's
# cache quota is spent on `Swatinem/rust-cache` entries of two to three
# gigabytes a job, and the runtime entry was the first evicted — gone within
# hours of being saved, which turned the next dispatch into a rebuild of WebKit
# with nothing under `runtime/` changed. A successful build therefore uploads
# the archive to the `wpe-runtime` prerelease, named for the pin and the
# packaging hash, and every run — this one and the bridge fast lane — asks that
# release first. The WebKit build tree stays a cache entry: it is only needed
# to package a runtime that does not exist yet.

# `contents: write` is for publishing the packaged runtime as a release asset
# (below); nothing here pushes a commit or a tag of its own.
permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: wpe-real-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  real-engine:
    name: Real engine tests
    # 22.04 is what the packaged artifact is built on: `build-runtime.sh`
    # refuses to package against a glibc newer than the `maximum_glibc` floor in
    # `runtime/source.toml`, so this is the provisioning a shipped runtime gets.
    # The same file's `minimum_gcc` is 12.2, above the runner's default GCC 11,
    # so GCC 12 is installed and selected explicitly.
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The same native dependencies `ci.yml` installs, plus the Vulkan loader
      # and its software implementation: the runtime hands frames over as
      # DMA-BUFs and both the smoke run at the end of `build-runtime.sh` and the
      # real-engine checks import them through wgpu. `bubblewrap` and
      # `xdg-dbus-proxy` are the host tools the packaged runtime launches its
      # web processes through — `WpeRuntimePaths::validate` insists on both, and
      # `build-runtime.sh` installs them itself, so this step is what a cache
      # hit needs. GCC 12 is for the WebKit build, and `gdb` is what
      # `run-smoke.py` reaches for when the smoke dies on a signal: without it
      # a crash reports a bare status and no stack.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm libasound2-dev libva-dev \
            libfontconfig1-dev libgbm-dev libxcb1-dev libglib2.0-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libgtk-4-dev libpipewire-0.3-dev libudev-dev libegl-dev \
            libwayland-dev libxkbcommon-dev mesa-vulkan-drivers libvulkan1 \
            bubblewrap unzip xdg-dbus-proxy gcc-12 g++-12 gdb
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wpe-real-engine
          cache-on-failure: true

      # The identity of a packaged runtime: the pinned WPE version, and a hash
      # of everything that decides what the archive contains — the packaging in
      # `runtime/` and the C bridge in `native/`. `runtime/source.toml` carries
      # the version the build uses and `build-runtime.sh` refuses to build when
      # it disagrees with the crate's `package.metadata.waterui.wpe-runtime`
      # pin, so hashing `runtime/**` covers the pin as well. The version leads
      # the name so that a consumer that can live with any packaging of the
      # pinned release — the bridge fast lane — can ask for the prefix.
      - name: Name the packaged runtime
        id: identity
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' browser-wpe/runtime/source.toml)"
          test -n "$version"
          echo "asset=wpe-runtime-$version-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser-wpe/runtime/**', 'browser-wpe/native/**') }}.zip" >> "$GITHUB_OUTPUT"

      # The durable copy: a runtime with this exact identity, published by an
      # earlier run. A hit skips the build and the caches alike.
      - name: Download the published WPE runtime
        id: published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime-artifacts
          if gh release download wpe-runtime --pattern '${{ steps.identity.outputs.asset }}' --dir runtime-artifacts 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # The first half of the split, and the one a hit skips the whole job on:
      # the packaged artifact, under the same identity as the release asset,
      # for a runtime built on this branch that has not been published yet.
      - name: Restore the packaged WPE runtime
        id: runtime
        if: steps.published.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: runtime-artifacts
          key: wpe-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser-wpe/runtime/**', 'browser-wpe/native/**') }}

      # The second, larger half of the split: the unpacked WPE WebKit release
      # and the prefix it installs into. Compiling it is hours and the C bridge
      # is seconds, so the two are cached apart — this one is keyed on the pin
      # and on the script that decides the CMake options, and notably not on
      # `native/**`, which is what lets a bridge-only change reuse the build.
      # Restore and save are separate steps because the save has to happen even
      # when the run fails afterwards: a bridge that does not compile must not
      # cost the WebKit build a second time.
      - name: Restore the WPE WebKit build
        id: webkit
        if: steps.published.outputs.found != 'true' && steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: wpe-work
          key: wpe-webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser-wpe/runtime/source.toml', 'browser-wpe/runtime/build-runtime.sh') }}

      # The smoke this script ends with has crashed in a way that only happens
      # at full speed, which is exactly what a debugger perturbs away, so the
      # kernel is asked to write a core instead: `run-smoke.py` reads
      # `kernel.core_pattern` to find it and prints the stacks out of it. The
      # runner's default pattern pipes cores to apport, which leaves nothing on
      # disk, and the core soft limit is zero.
      - name: Build the WPE runtime from source
        if: steps.published.outputs.found != 'true' && steps.runtime.outputs.cache-hit != 'true'
        env:
          WATERUI_WPE_WORK_DIRECTORY: ${{ github.workspace }}/wpe-work
        run: |
          sudo sysctl -w kernel.core_pattern=/tmp/waterui-core.%E.%p
          ulimit -c unlimited
          browser-wpe/runtime/build-runtime.sh runtime-artifacts

      # `webkit-build-identity` is written by `build-runtime.sh` once the
      # install prefix holds a complete build, so this saves the WebKit half
      # exactly when there is one to save — including after a later step failed.
      - name: Save the WPE WebKit build
        if: always() && steps.webkit.outputs.cache-hit != 'true' && hashFiles('wpe-work/webkit-build-identity') != ''
        uses: actions/cache/save@v4
        with:
          path: wpe-work
          key: wpe-webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser-wpe/runtime/source.toml', 'browser-wpe/runtime/build-runtime.sh') }}

      # The durable copy, written. One prerelease holds every packaged runtime,
      # each asset named for its identity, so a later run — on any branch —
      # downloads it instead of rebuilding, and the cache quota has nothing to
      # say about it. The archive's own name is the one `water package` knows;
      # the asset name is the identity, so the file is copied under it.
      - name: Publish the packaged WPE runtime
        if: steps.published.outputs.found != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$(echo runtime-artifacts/waterui-wpe-*.zip)"
          test -f "$archive"
          cp "$archive" '${{ steps.identity.outputs.asset }}'
          if ! gh release view wpe-runtime >/dev/null 2>&1; then
            gh release create wpe-runtime --prerelease --title 'WPE runtime builds' \
              --notes 'Packaged WPE WebKit runtimes built by the WPE Real Engine workflow, one asset per pinned version and packaging hash. Consumed by CI; not a release of the crates.'
          fi
          gh release upload wpe-runtime '${{ steps.identity.outputs.asset }}' --clobber

      # Unpacking the archive rather than reaching into the build tree is the
      # point: this is the same layout `water package` downloads and stages, so
      # the checks run against what an application actually ships with. The
      # archive is `waterui-wpe-*.zip` when it was built here and the asset name
      # when it was downloaded, hence the wider glob.
      #
      # The prefix the runtime was built at has to be gone as well. WebKit
      # compiles its libexec directory into the library and consults the
      # bridge's `WEBKIT_EXEC_PATH` only because `build-runtime.sh` builds in
      # developer mode; with the build tree still on disk the compiled-in path
      # resolves, and a runtime that could not be relocated at all passed every
      # earlier run of this job. The archive records the prefix in its
      # pkg-config file, so it is read from there rather than assumed.
      - name: Stage the packaged runtime
        shell: bash
        run: |
          archive="$(echo runtime-artifacts/*.zip)"
          test -f "$archive"
          unzip -q "$archive" -d wpe-runtime
          built_at="$(sed -n 's/^prefix=//p' wpe-runtime/lib/pkgconfig/wpe-webkit-2.0.pc)"
          case "$built_at" in
            "$GITHUB_WORKSPACE"/*) rm -rf "$built_at" ;;
            *)
              echo "::error::$archive was built at '$built_at', outside this workspace, so the relocation check cannot remove it"
              exit 1
              ;;
          esac
          echo "WATERUI_WPE_RUNTIME=$GITHUB_WORKSPACE/wpe-runtime" >> "$GITHUB_ENV"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # The invocation `ci.yml` cannot satisfy, run where the runtime exists.
      #
      # It runs under nextest because WPE WebKit is one runtime per process:
      # `cargo test` starts every test in a thread of one process, and the
      # second `WpeRuntime` in a process is refused by the bridge. nextest gives
      # each test its own process, which is the shape these tests need rather
      # than a way around the contract. The crash reporter wraps it because a
      # test binary that dies on a signal takes its output down with it, and
      # `WATERUI_WPE_CONSOLE` puts each page's own console in the log, so a
      # bridge script that throws says so instead of timing out in silence.
      - name: Test the WPE surfaces against the real engine
        run: |
          sudo sysctl -w kernel.core_pattern=/tmp/waterui-core.%E.%p
          ulimit -c unlimited
          WATERUI_WPE_CONSOLE=1 \
            browser-wpe/runtime/run-with-crash-report.py cargo nextest run \
              -p waterui-browser-wpe --all-targets --features real-engine,runtime-smoke
