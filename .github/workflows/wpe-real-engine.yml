name: WPE Real Engine

# Builds, tests and publishes the packaged WPE runtime — the archive the `water`
# CLI downloads for `waterui-browser-wpe` — for x86_64 and aarch64 Linux.
#
# The web view bridge has failed three times in ways no Rust-side test could
# see — replies crossing as base64, a frozen `waterui` object, integers past
# 2^53 losing their low bits — so `browser-wpe/tests/real_engine.rs` drives a
# genuine WPE WebKit engine, and this workflow is where it runs, on both
# architectures, against the unpacked archive rather than the build tree.
#
# A packaged runtime is named by its identity: a digest of every input that
# decides what the archive contains, computed by `runtime/identity.py`, which
# lists those inputs. The crate declares the same value as
# `package.metadata.waterui.wpe-runtime.identity`, and `ci.yml` fails a change
# whose inputs no longer hash to it, so whoever resolved the package — the
# `water` CLI — knows which runtime belongs to it without asking anyone. Each
# identity is published once, as the prerelease `wpe-runtime-<version>-<identity>`
# holding one archive per architecture and the `browser-runtime-manifest.json`
# that records each archive's URL, size and SHA-256. The tag cannot be one of
# release-plz's (`wpe-v*`, `cef-v*`), and it is never written twice: a run
# whose identity is already published downloads that release, checks it
# against its manifest and tests it, and publishes nothing; `gh release create`
# refuses an existing tag, so two runs racing to one identity cannot replace
# what the first published.
#
# Publishing waits for both architectures to pass the smoke run and the
# real-engine suite, so every published runtime is one these tests accepted.
# It happens from any ref: the identity covers this workflow too, so a topic
# branch that publishes has built exactly what `dev` will build once it merges,
# and the push run after the merge finds it and only tests it. A push to `dev`
# that changes an input publishes on its own, so every identity `dev` declares
# has its runtime; the push filter below is `runtime/identity.py`'s input list.
#
# Building is a multi-hour compile of WPE WebKit from the pinned source tarball,
# hence the timeout and the two caches per architecture. WebKit itself is keyed
# on the pin and the build options alone, so a change to the bridge — seconds
# of compiling — reuses the hours already spent; the packaged archive is keyed
# on the identity, so a run whose other leg failed repackages nothing when it is
# re-run. Neither cache is the durable copy: the repository's quota is spent on
# `Swatinem/rust-cache` entries and evicts these within hours. The published
# release is.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - browser-wpe/runtime/**
      - browser-wpe/native/**
      - LICENSE-APACHE
      - LICENSE-MIT
      - .github/actions/llvm-apt-source/**
      - .github/workflows/wpe-real-engine.yml

# A `dev` push publishes the identity of its own commit, which a later push must
# not cancel: the lockfile of a consumer may name exactly that commit. Elsewhere
# the newest dispatch on a ref supersedes the older one.
concurrency:
  group: wpe-real-engine-${{ github.ref == 'refs/heads/dev' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  identity:
    name: Runtime identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      identity: ${{ steps.identity.outputs.identity }}
      tag: ${{ steps.identity.outputs.tag }}
      published: ${{ steps.identity.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      # `--check` refuses an identity the crate does not declare: a runtime
      # published under it could never be found by a consumer of this commit.
      - name: Name the packaged runtime
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' browser-wpe/runtime/source.toml)"
          test -n "$version"
          identity="$(browser-wpe/runtime/identity.py --check)"
          tag="wpe-runtime-$version-$identity"
          published="$(gh release list --exclude-drafts --limit 1000 --json tagName \
            --jq "any(.[]; .tagName == \"$tag\")")"
          {
            echo "version=$version"
            echo "identity=$identity"
            echo "tag=$tag"
            echo "published=$published"
          } >> "$GITHUB_OUTPUT"

  real-engine:
    name: Real engine tests / ${{ matrix.architecture }}
    needs: identity
    # 22.04 is what the packaged artifact is built on: `build-runtime.sh`
    # refuses to package against a glibc newer than the `maximum_glibc` floor in
    # `runtime/source.toml`, so this is the provisioning a shipped runtime gets,
    # on both architectures. The same file's `minimum_clang` is the toolchain
    # upstream's development SDK builds this WebKit with; the jammy archive
    # stops at Clang 15, so `llvm-apt-source` takes it from apt.llvm.org, which
    # carries it for both, and selects it explicitly.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-22.04
          - architecture: aarch64
            runner: ubuntu-22.04-arm
    env:
      WATERUI_WPE_WORK_DIRECTORY: ${{ github.workspace }}/wpe-work
      # The name `package-runtime.py` gives the archive, and the asset name in
      # the published release.
      ARCHIVE: waterui-wpe-${{ needs.identity.outputs.version }}-linux-${{ matrix.architecture }}.zip
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llvm-apt-source
      - uses: dtolnay/rust-toolchain@stable
      # The same native dependencies `ci.yml` installs, plus the Vulkan loader
      # and its software implementation: the runtime hands frames over as
      # DMA-BUFs and both the smoke run at the end of `build-runtime.sh` and the
      # real-engine checks import them through wgpu. `bubblewrap` and
      # `xdg-dbus-proxy` are the host tools the packaged runtime launches its
      # web processes through — `WpeRuntimePaths::validate` insists on both, and
      # `build-runtime.sh` installs them itself, so this step is what a cache
      # hit needs. The pinned Clang is for the WebKit build, `gcc-12`/`g++-12` supply
      # the libstdc++ `build-runtime.sh` pins it to, and `gdb` is what
      # `run-smoke.py` reaches for when the smoke dies on a signal: without it
      # a crash reports a bare status and no stack.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm libasound2-dev libva-dev \
            libfontconfig1-dev libgbm-dev libxcb1-dev libglib2.0-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libgtk-4-dev libpipewire-0.3-dev libudev-dev libegl-dev \
            libwayland-dev libxkbcommon-dev mesa-vulkan-drivers libvulkan1 \
            bubblewrap unzip xdg-dbus-proxy "$CLANG_PACKAGE" gcc-12 g++-12 gdb
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wpe-real-engine
          key: ${{ matrix.architecture }}
          cache-on-failure: true

      # The published runtime for this identity, fetched the way a consumer
      # fetches it: through the release's manifest, whose SHA-256 the archive
      # has to match. A hit skips the build and the caches alike.
      - name: Download the published WPE runtime
        if: needs.identity.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern browser-runtime-manifest.json --dir runtime-manifest
          gh release download "$TAG" --pattern "$ARCHIVE" --dir runtime-artifacts
          # shellcheck disable=SC2016 # `$file` is jq's, bound by --arg
          jq -r --arg file "$ARCHIVE" \
            '.artifacts[] | select(.url | endswith("/" + $file)) | "\(.sha256)  \($file)"' \
            runtime-manifest/browser-runtime-manifest.json \
            | (cd runtime-artifacts && sha256sum --check --strict -)

      # The packaged archive of a run on any branch that built this identity
      # and has not published it yet — because the other architecture failed.
      - name: Restore the packaged WPE runtime
        id: runtime
        if: needs.identity.outputs.published != 'true'
        uses: actions/cache@v4
        with:
          path: runtime-artifacts
          key: wpe-runtime-${{ runner.os }}-${{ runner.arch }}-${{ needs.identity.outputs.identity }}

      # The second, larger half of the split: the unpacked WPE WebKit release
      # and the prefix it installs into. Compiling it is hours and the C bridge
      # is seconds, so the two are cached apart — this one is keyed on the pin
      # and on the script that decides the CMake options, and notably not on
      # `native/**`, which is what lets a bridge-only change reuse the build.
      # Restore and save are separate steps because the save has to happen even
      # when the run fails afterwards: a bridge that does not compile must not
      # cost the WebKit build a second time.
      - name: Restore the WPE WebKit build
        id: webkit
        if: needs.identity.outputs.published != 'true' && steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: wpe-work
          key: wpe-webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser-wpe/runtime/source.toml', 'browser-wpe/runtime/build-webkit.sh', 'browser-wpe/runtime/compiler.sh') }}

      # The smoke this script ends with has crashed in a way that only happens
      # at full speed, which is exactly what a debugger perturbs away, so the
      # kernel is asked to write a core instead: `run-smoke.py` reads
      # `kernel.core_pattern` to find it and prints the stacks out of it. The
      # runner's default pattern pipes cores to apport, which leaves nothing on
      # disk, and the core soft limit is zero.
      - name: Build the WPE runtime from source
        if: needs.identity.outputs.published != 'true' && steps.runtime.outputs.cache-hit != 'true'
        run: |
          sudo sysctl -w kernel.core_pattern=/tmp/waterui-core.%E.%p
          ulimit -c unlimited
          browser-wpe/runtime/build-runtime.sh runtime-artifacts

      # `build-webkit.sh` writes its completion marker into the install prefix
      # once it holds a complete build, so this saves the WebKit half exactly
      # when there is one to save — including after a later step failed.
      - name: Save the WPE WebKit build
        if: always() && steps.webkit.outputs.cache-hit != 'true' && hashFiles('wpe-work/runtime/.webkit-installed-*') != ''
        uses: actions/cache/save@v4
        with:
          path: wpe-work
          key: wpe-webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser-wpe/runtime/source.toml', 'browser-wpe/runtime/build-webkit.sh', 'browser-wpe/runtime/compiler.sh') }}

      # What the publish job assembles the release from: the archive and the
      # metadata `package-runtime.py` wrote beside it, which carries its SHA-256.
      - name: Hand the packaged runtime to the publish job
        if: needs.identity.outputs.published != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wpe-runtime-${{ matrix.architecture }}
          if-no-files-found: error
          path: |
            runtime-artifacts/${{ env.ARCHIVE }}
            runtime-artifacts/${{ env.ARCHIVE }}.artifact.json

      # Unpacking the archive rather than reaching into the build tree is the
      # point: this is the same layout `water package` downloads and stages, so
      # the checks run against what an application actually ships with.
      #
      # The prefix the runtime was built at has to be gone as well. WebKit
      # compiles its libexec directory into the library and consults the
      # bridge's `WEBKIT_EXEC_PATH` only because `build-runtime.sh` builds in
      # developer mode; with the build tree still on disk the compiled-in path
      # resolves, and a runtime that could not be relocated at all passed every
      # earlier run of this job. `build-runtime.sh` installs into the `runtime`
      # directory of its work directory; a downloaded runtime was built on
      # another runner, so there is nothing of it here to remove.
      - name: Stage the packaged runtime
        run: |
          unzip -q "runtime-artifacts/$ARCHIVE" -d wpe-runtime
          rm -rf "$WATERUI_WPE_WORK_DIRECTORY/runtime"
          echo "WATERUI_WPE_RUNTIME=$GITHUB_WORKSPACE/wpe-runtime" >> "$GITHUB_ENV"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # The invocation `ci.yml` cannot satisfy, run where the runtime exists.
      #
      # It runs under nextest because WPE WebKit is one runtime per process:
      # `cargo test` starts every test in a thread of one process, and the
      # second `WpeRuntime` in a process is refused by the bridge. nextest gives
      # each test its own process, which is the shape these tests need rather
      # than a way around the contract. The crash reporter wraps it because a
      # test binary that dies on a signal takes its output down with it, and
      # `WATERUI_WPE_CONSOLE` puts each page's own console in the log, so a
      # bridge script that throws says so instead of timing out in silence.
      - name: Test the WPE surfaces against the real engine
        run: |
          sudo sysctl -w kernel.core_pattern=/tmp/waterui-core.%E.%p
          ulimit -c unlimited
          WATERUI_WPE_CONSOLE=1 \
            browser-wpe/runtime/run-with-crash-report.py cargo nextest run \
              -p waterui-browser-wpe --all-targets --features real-engine,runtime-smoke

  publish:
    name: Publish the packaged runtime
    needs: [identity, real-engine]
    if: needs.identity.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Creates the identity's release and its tag; nothing here pushes a commit.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: wpe-runtime-*
          path: runtime-artifacts
          merge-multiple: true
      # `gh release create` uploads the assets to a draft and publishes it once
      # all of them are there, so a consumer never sees a release without its
      # manifest, and it fails when the tag already exists rather than touching
      # a published runtime.
      - name: Publish the WPE runtime release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.identity.outputs.tag }}
          VERSION: ${{ needs.identity.outputs.version }}
          IDENTITY: ${{ needs.identity.outputs.identity }}
        run: |
          browser-wpe/runtime/generate-manifest.py \
            --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --output runtime-artifacts/browser-runtime-manifest.json \
            runtime-artifacts/*.artifact.json
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "WPE runtime $VERSION ($IDENTITY)" \
            --notes "Packaged WPE WebKit $VERSION runtime for Linux x86_64 and aarch64, identity $IDENTITY, built from $GITHUB_SHA. Consumed by the water CLI through \`browser-runtime-manifest.json\`; not a release of the crates." \
            runtime-artifacts/*.zip \
            runtime-artifacts/browser-runtime-manifest.json
