[package]
name = "waterui-browser-wpe"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/browsers"
description = "Bundled WPE WebKit runtime for WaterUI on Linux"
keywords = ["wpe", "webkit", "webview", "browser", "waterui"]
categories = ["gui", "web-programming"]

# The WPE WebKit release this crate's bundled runtime is built from, and the
# only place that version is decided. `runtime/build-runtime.sh` reads it from
# here and refuses to build a runtime whose source configuration disagrees with
# it. Because it travels with the published crate, a consumer — the `water` CLI,
# which resolves which runtime artifact to download — reads the pin belonging to
# the exact crate version it depends on rather than keeping a copy of its own.
#
# `identity` names the packaged runtime built for this exact source: WPE Real
# Engine publishes it as the `wpe-runtime-<version>-<identity>` release of this
# repository, beside the `browser-runtime-manifest.json` a consumer downloads it
# through. `runtime/identity.py` computes it from everything that decides the
# archive's contents, and CI fails a change that leaves it stale.
[package.metadata.waterui.wpe-runtime]
version = "2.54.2"
identity = "d6117ebfbc001792"
bridge-abi = 5
native-source = "native"

[lints]
workspace = true

[dependencies]
tracing = "0.1.44"
executor-core = "0.7.1"
cookie = { version = "0.18.1", optional = true }
futures = { version = "0.3", optional = true }
libloading = "0.9"
nami = { version = "0.13", optional = true }
num-traits = { version = "0.2", default-features = false }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
waterui-core = { version = "0.5.1" }
suiteki = { git = "https://github.com/water-rs/suiteki.git", branch = "dev", optional = true }
waterui-url = { version = "0.5.1", optional = true }
waterui-watcher-set = { version = "0.5.1", optional = true }
waterui-webview = { version = "0.5.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
futures-timer = "3"
keycode = { version = "1.0", optional = true }
kurbo = "0.13"
waterui-graphics = { version = "0.5.1", features = ["gpu"] }
wgpu = "30.0.1"
wgpu-external-frame = { version = "0.4.0", git = "https://github.com/water-rs/wgpu-external-frame.git", branch = "dev" }
xkeysym = { version = "0.2.1", optional = true }

[dev-dependencies]
base64 = "0.22"
executor-core = { version = "0.7.1", features = ["async-executor"] }
libtest-mimic = { version = "0.8.2", default-features = false }
pollster = "1.0"
tiny_http = "0.12"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The blit pipeline's uniform block is declared in both `src/wpe_blit.wgsl` and
# `src/gpu.rs`, and only a GPU compares them at run time. `naga` is how the test
# beside the shader compares them on any host — pinned to the version `wgpu`
# parses the shader with, so the reflection answers for the same front end.
[target.'cfg(target_os = "linux")'.dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }

[[example]]
name = "runtime_smoke"
required-features = ["runtime-smoke"]

[[test]]
name = "real_engine"
harness = false
required-features = ["real-engine"]

[features]
default = ["webview"]
real-engine = ["webview", "waterui-webview/conformance"]
runtime-smoke = ["webview", "waterui-webview/conformance"]
webview = [
    "dep:cookie",
    "dep:futures",
    "dep:keycode",
    "dep:nami",
    "dep:serde",
    "dep:serde_json",
    "dep:suiteki",
    "dep:waterui-url",
    "dep:waterui-watcher-set",
    "dep:waterui-webview",
    "dep:xkeysym",
]
