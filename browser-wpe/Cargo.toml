[package]
name = "waterui-browser-wpe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/browsers"
description = "Bundled WPE WebKit runtime for WaterUI on Linux"
keywords = ["wpe", "webkit", "webview", "browser", "waterui"]
categories = ["gui", "web-programming"]

# The WPE WebKit release this crate's bundled runtime is built from, and the
# only place that version is decided. `runtime/build-runtime.sh` reads it from
# here and refuses to build a runtime whose source configuration disagrees with
# it. Because it travels with the published crate, a consumer — the `water` CLI,
# which resolves which runtime artifact to download — reads the pin belonging to
# the exact crate version it depends on rather than keeping a copy of its own.
[package.metadata.waterui.wpe-runtime]
version = "2.52.5"

[lints]
workspace = true

[dependencies]
tracing = "0.1.44"
executor-core = "0.7.1"
cookie = { version = "0.18.1", optional = true }
futures = { version = "0.3", optional = true }
libloading = "0.9"
nami = { version = "0.11.0", optional = true }
num-traits = { version = "0.2", default-features = false }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
waterui-core = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev" }
waterui-str = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev", optional = true }
waterui-url = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev", optional = true }
waterui-webview = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
futures-timer = "3"
keycode = { version = "1.0", optional = true }
kurbo = "0.13"
waterui-graphics = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev", features = ["gpu"] }
wgpu = "29.0.4"
wgpu-external-frame = { version = "0.1.0", git = "https://github.com/water-rs/wgpu-external-frame.git", branch = "dev" }
xkeysym = { version = "0.2.1", optional = true }

[dev-dependencies]
base64 = "0.22"
executor-core = { version = "0.7.1", features = ["async-executor"] }
pollster = "1.0"
tiny_http = "0.12"

[[example]]
name = "runtime_smoke"
required-features = ["runtime-smoke"]

[[test]]
name = "real_engine"
required-features = ["real-engine"]

[features]
default = ["webview"]
real-engine = ["webview"]
runtime-smoke = ["webview"]
webview = [
    "dep:cookie",
    "dep:futures",
    "dep:keycode",
    "dep:nami",
    "dep:serde",
    "dep:serde_json",
    "dep:waterui-str",
    "dep:waterui-url",
    "dep:waterui-webview",
    "dep:xkeysym",
]
