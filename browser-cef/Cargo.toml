[package]
name = "waterui-browser-cef"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
build = "build.rs"
readme = "README.md"
repository = "https://github.com/water-rs/browsers"
description = "Shared CEF runtime for WaterUI WebView and Chromium components"
keywords = ["cef", "chromium", "webview", "browser", "waterui"]
categories = ["gui", "web-programming"]

[lints]
workspace = true

[features]
default = ["cef-runtime"]
# `cef-runtime` and `compile-only` describe incompatible builds and `build.rs`
# rejects them together. `cef-runtime` is a default feature, so the compile-only
# build is `--no-default-features --features compile-only`, and `--all-features`
# is never a valid selection for this crate.
cef-runtime = ["cef/sandbox", "cef-dll-sys/sandbox"]
compile-only = ["cef/dox", "cef-dll-sys/dox"]
chromium = [
    "dep:base64",
    "dep:keycode",
    "dep:waterui-chromium",
    "dep:waterui-watcher-set",
]
real-engine = ["cef-runtime", "webview", "chromium"]
webview = [
    "dep:cookie",
    "dep:keycode",
    "dep:suiteki",
    "dep:waterui-watcher-set",
    "dep:waterui-webview",
]

[dependencies]
async-channel = "2.5"
base64 = { version = "0.23", optional = true }
cef = { version = "=150.2.1", default-features = false }
cef-dll-sys = { version = "=150.2.1", default-features = false }
cookie = { version = "0.18.2", optional = true }
dirs = "6.0.0"
futures = "0.3"
futures-lite = "2.6"
futures-timer = "3"
executor-core = "0.7.1"
keycode = { version = "1.0", optional = true }
kurbo = "0.13"
num-traits = { version = "0.2", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
thiserror = "2.0.19"
tracing = "0.1.44"
waterui-chromium = { version = "0.5.1", git = "https://github.com/water-rs/waterui.git", branch = "dev", optional = true }
waterui-core = { version = "0.5.1", git = "https://github.com/water-rs/waterui.git", branch = "dev" }
waterui-graphics = { version = "0.5.1", git = "https://github.com/water-rs/waterui.git", branch = "dev", features = ["gpu"] }
suiteki = { git = "https://github.com/water-rs/suiteki.git", branch = "dev", optional = true }
waterui-watcher-set = { version = "0.5.1", git = "https://github.com/water-rs/waterui.git", branch = "dev", optional = true }
waterui-url = { version = "0.5.1", git = "https://github.com/water-rs/waterui.git", branch = "dev" }
waterui-webview = { version = "0.5.1", git = "https://github.com/water-rs/waterui.git", branch = "dev", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libloading = "0.9"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = [
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-security = { version = "0.3", features = [
    "CSCommon",
    "SecCode",
    "SecStaticCode",
] }
wgpu = "30.0.1"
wgpu-external-frame = { version = "0.4.0", git = "https://github.com/water-rs/wgpu-external-frame.git", branch = "dev" }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = "30.0.1"
wgpu-external-frame = { version = "0.4.0", git = "https://github.com/water-rs/wgpu-external-frame.git", branch = "dev" }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = "30.0.1"
wgpu-external-frame = { version = "0.4.0", git = "https://github.com/water-rs/wgpu-external-frame.git", branch = "dev" }

[dev-dependencies]
askama = "0.16"
base64 = "0.23"
executor-core = { version = "0.7.1", features = ["async-executor"] }
tiny_http = "0.12"
tempfile = "3.27"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The shared real-engine assertions; `real-engine` already selects `webview`.
waterui-webview = { version = "0.5.1", git = "https://github.com/water-rs/waterui.git", branch = "dev", features = ["conformance"] }

[[test]]
name = "real_engine"
harness = false
required-features = ["real-engine"]

[build-dependencies]
cc = "1.2"

[package.metadata.cargo-machete]
ignored = ["cc", "cef-dll-sys"]
