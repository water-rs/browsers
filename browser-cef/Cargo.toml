[package]
name = "waterui-browser-cef"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
build = "build.rs"
readme = "README.md"
repository = "https://github.com/water-rs/browsers"
description = "Shared CEF runtime for WaterUI WebView and Chromium components"
keywords = ["cef", "chromium", "webview", "browser", "waterui"]
categories = ["gui", "web-programming"]

[lints]
workspace = true

[features]
default = ["cef-runtime"]
cef-runtime = ["cef/sandbox", "cef-dll-sys/sandbox"]
compile-only = ["cef/dox", "cef-dll-sys/dox"]
chromium = [
    "dep:async-channel",
    "dep:base64",
    "dep:keycode",
    "dep:waterui-chromium",
    "dep:waterui-webview",
]
real-engine = ["cef-runtime", "webview"]
webview = ["dep:cookie", "dep:keycode", "dep:waterui-str", "dep:waterui-webview"]

[dependencies]
async-channel = { version = "2.5", optional = true }
base64 = { version = "0.22", optional = true }
cef = { version = "=150.2.1", default-features = false }
cef-dll-sys = { version = "=150.2.1", default-features = false }
cookie = { version = "0.18.1", optional = true }
dirs = "6.0.0"
futures = "0.3"
futures-timer = "3"
executor-core = "0.7.1"
keycode = { version = "1.0", optional = true }
kurbo = "0.13"
num-traits = { version = "0.2", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
thiserror = "2.0.19"
tracing = "0.1.44"
waterui-chromium = { version = "0.1.0", git = "https://github.com/water-rs/waterui.git", branch = "dev", optional = true }
waterui-core = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev" }
waterui-graphics = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev", features = ["gpu"] }
waterui-str = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev", optional = true }
waterui-url = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev" }
waterui-webview = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libloading = "0.9"
objc2 = "0.6"
wgpu = "29.0.4"
wgpu-external-frame = { version = "0.1.0", git = "https://github.com/water-rs/wgpu-external-frame.git", branch = "dev" }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = "29.0.4"
wgpu-external-frame = { version = "0.1.0", git = "https://github.com/water-rs/wgpu-external-frame.git", branch = "dev" }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = "29.0.4"
wgpu-external-frame = { version = "0.1.0", git = "https://github.com/water-rs/wgpu-external-frame.git", branch = "dev" }

[dev-dependencies]
askama = "0.16"
base64 = "0.22"
executor-core = { version = "0.7.1", features = ["async-executor"] }
tiny_http = "0.12"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[test]]
name = "real_engine"
harness = false
required-features = ["real-engine"]

[build-dependencies]
cc = "1.2"

[package.metadata.cargo-machete]
ignored = ["cc", "cef-dll-sys"]
